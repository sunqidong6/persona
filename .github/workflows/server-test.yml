name: Server CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    name: Test reset (${{ matrix.build }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        build: [default, core-only]
    env:
      GOMAXPROCS: '2'
      GOMEMLIMIT: 6GiB
      SUBJECT_SHA: '0d564d3ef3dfec1e03ac2ed7ec271d442e3262e8'
      BUILD: ${{ matrix.build }}
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: persona
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: persona_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U persona -d persona_test"
          --health-interval 2s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SUBJECT_SHA }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache: false
      - name: Verify source and run database and assistant regressions
        working-directory: server
        shell: bash
        env:
          POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}
        run: |
          set -euo pipefail
          actual=$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)
          test "$actual" = "$SUBJECT_SHA"
          printf 'Testing PR head %s with %s and PostgreSQL 18\n' "$actual" "$(go version)"
          fixture=$(mktemp -d)
          trap 'rm -f -- "$fixture/database.json"; rmdir -- "$fixture"' EXIT
          printf '{"database_url":"postgresql://persona:ci-only@127.0.0.1:%s/persona?sslmode=disable"}\n' "$POSTGRES_PORT" > "$fixture/database.json"
          flags=()
          if [ "$BUILD" = core-only ]; then flags=(-tags persona_core_only); fi
          python3 ../scripts/test/server_test_env.py --database-file "$fixture/database.json" -- go test -p 1 -count=1 -v "${flags[@]}" ./internal/db
          python3 ../scripts/test/server_test_env.py --database-file "$fixture/database.json" -- go test -p 1 -count=1 -v "${flags[@]}" -run '^(TestTaskPlansList(ExtensionScope)?|TestCloseoutIsChecked|TestCloseoutDisprovedIsShown|TestTodoDetachRetiresTransientRetry|TestTaskRepositoryOwnershipNativeCreateMustSucceedAfterTaskLink|TestUserCheckRecoversMissingPassAsk|TestTodoWriteOutcomeFixtures)$' ./internal/assistant
