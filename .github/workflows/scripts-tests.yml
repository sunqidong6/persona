name: Scripts and docs CI
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scripts-${{ github.repository }}-${{ github.ref_name }}-scripts
  cancel-in-progress: true
jobs:
  scripts:
    name: Scripts and guards shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        shard: [0, 1]
    env:
      CI_PYTHON_SHARD_INDEX: ${{ matrix.shard }}
      CI_PYTHON_SHARD_COUNT: '2'
    steps:
      # Full history so a branch dispatch can merge-base origin/main (#11489); file contents only at the tip
      # (blob:none), with the few base files a suite reads fetched on demand from the public repository.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: |
            server/go.sum
            sdk/go/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/ci/requirements.txt
      - name: Install script validation dependencies
        run: python3 -m pip install -r scripts/ci/requirements.txt
      - name: Expose the Swift toolchain's plist converter
        run: |
          swift_bin="$(dirname "$(readlink -f "$(command -v swift)")")"
          if [ ! -x "$swift_bin/plutil" ] && [ -x /usr/share/swift/usr/bin/plutil ]; then
            swift_bin=/usr/share/swift/usr/bin
          fi
          "$swift_bin/plutil" -help >/dev/null
          echo "$swift_bin" >> "$GITHUB_PATH"
      - name: Install workflow validator
        shell: bash
        run: |
          version=1.7.12
          archive="actionlint_${version}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --retry 3 --max-time 60 \
            --output "$archive" "https://github.com/rhysd/actionlint/releases/download/v${version}/$archive"
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' "$archive" | sha256sum --check
          mkdir -p actionlint-bin
          tar -xzf "$archive" -C actionlint-bin actionlint
          printf '%s\n' "$RUNNER_TEMP/actionlint-bin" >> "$GITHUB_PATH"
      - name: Scripts and docs checks
        run: scripts/ci/scripts.sh
